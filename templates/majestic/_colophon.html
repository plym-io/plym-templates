{% import "_icons.html" as ic %}
<footer class="colophon">
  <div class="shell colophon-in">
    <a class="colophon-name" href="{{ site.blog_prefix or '/' }}">{{ site.name }}</a>
    {% if site.description %}<p class="colophon-note">{{ site.description }}</p>{% endif %}
    {% if site.website %}
      <a class="colophon-link" href="{{ site.website if '//' in site.website else 'https://' ~ site.website }}">
        <span>{{ (site.website | replace('https://', '') | replace('http://', '') | replace('www.', '')).rstrip('/') }}</span>
        {{ ic.chevron(12) }}
      </a>
    {% endif %}
    <a class="plym-builtwith" href="https://plym.io" rel="noopener noreferrer">
      <span>Built with</span>
      <svg class="plym-builtwith__logo" viewBox="0 0 602 502" aria-hidden="true" focusable="false">
        <path fill="#F43D02" d="M323,501 C215,501 108,501 1,501 C1,334 1,168 1,1 C201,1 401,1 601,1 C601,168 601,334 601,501 C508,501 416,501 323,501 M123,387 C181,352 239,317 297,282 C303,292 309,301 315,311 C260,345 205,378 149,412 C151,413 152,413 152,413 C225,413 298,413 371,413 C375,413 376,411 377,408 C411,322 445,235 479,148 C480,147 480,145 481,143 C478,143 476,143 474,143 C391,143 307,143 224,143 C219,143 217,145 215,149 C191,211 166,272 142,334 C135,351 129,369 121,387 C122,387 122,387 123,387 z"/>
        <path fill="#FFFFFF" d="M122,387 C129,369 135,351 142,334 C166,272 191,211 215,149 C217,145 219,143 224,143 C307,143 391,143 474,143 C476,143 478,143 481,143 C480,145 480,147 479,148 C445,235 411,322 377,408 C376,411 375,413 371,413 C298,413 225,413 152,413 C152,413 151,413 149,412 C205,378 260,345 315,311 C309,301 303,292 297,282 C239,317 181,352 123,387 C122,387 122,387 122,387 z"/>
      </svg>
      <span class="plym-builtwith__name">plym</span>
    </a>
  </div>
</footer>
