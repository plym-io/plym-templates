fonts:
  # The two families the source site actually loads. Its chrome asks for
  # Pretendard, every one of those URLs 404s, and it paints in the system UI
  # stack instead — which is what --cp-sys reproduces in the CSS.
  heading:
    family: Poppins
    weights:
      bold: 600
  body:
    family: Lato
    weights:
      regular: 400
      bold: 700

colors:
  primary: "#121A42"
  secondary: "#6A7092"
  accent: "#BF111F"
  background: "#FFFFFF"

prism:
  theme: tomorrow
