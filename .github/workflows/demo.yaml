name: demo

on:
  workflow_dispatch:
    inputs:
      name:
        description: Template name
        required: true
        type: string

concurrency:
  group: demo
  cancel-in-progress: false

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      API: https://api.cloud.plym.io
      TEMPLATE: ${{ inputs.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the template exists
        run: |
          if [ ! -f "templates/$TEMPLATE/template.yaml" ]; then
            echo "templates/$TEMPLATE/template.yaml not found"
            exit 1
          fi
          echo "SLUG=templates-$TEMPLATE" >> "$GITHUB_ENV"
          echo "DEMO_HOST=templates-$TEMPLATE.plym.space" >> "$GITHUB_ENV"

      - name: Create or resume the blog
        env:
          EMAIL: ${{ secrets.PLYM_CLOUD_EMAIL }}
          PASSWORD: ${{ secrets.PLYM_CLOUD_PASSWORD }}
        run: |
          TOKEN=$(curl -sS --fail-with-body -X POST "$API/api/auth/login" -H 'Content-Type: application/json' --data "$(jq -n --arg e "$EMAIL" --arg p "$PASSWORD" '{email:$e,password:$p}')" | jq -r .access)
          echo "::add-mask::$TOKEN"
          OPS_BASE="$API/api/ops"
          OPS_TOKEN="$TOKEN"
          wait_op() {
            local after=0 page state
            for _ in $(seq 1 200); do
              page=$(curl -sS --fail-with-body -H "Authorization: Bearer $OPS_TOKEN" "$OPS_BASE/$1/events?after=$after")
              echo "$page" | jq -r '.events[] | [.event, (.title // .message // .line // .outcome // "")] | join("  ")'
              after=$(echo "$page" | jq -r .next_after)
              state=$(echo "$page" | jq -r .state)
              case "$state" in
                succeeded|finished) return 0 ;;
                failed) echo "$page" | jq -c .error; return 1 ;;
              esac
              sleep 3
            done
            echo "op $1 did not finish in time"
            return 1
          }
          state=$(curl -sS --fail-with-body -H "Authorization: Bearer $TOKEN" "$API/api/blogs" | jq -r --arg s "$SLUG" '.blogs[] | select(.slug == $s) | .state')
          case "$state" in
            "")
              available=$(curl -sS --fail-with-body -H "Authorization: Bearer $TOKEN" "$API/api/slug-check?slug=$SLUG" | jq -r .available)
              if [ "$available" != "true" ]; then
                echo "slug $SLUG is taken by a blog outside this account"
                exit 1
              fi
              created=$(curl -sS --fail-with-body -X POST "$API/api/blogs" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data "$(jq -n --arg s "$SLUG" --arg t "$TEMPLATE" '{slug:$s,name:$t,template:$t}')")
              op_id=$(echo "$created" | jq -r .op_id)
              template_op_id=$(echo "$created" | jq -r .template_op_id)
              wait_op "$op_id"
              if [ "$template_op_id" = "null" ]; then
                echo "the template install was not chained; blog $SLUG is left in place"
                exit 1
              fi
              wait_op "$template_op_id"
              echo "INSTALLED=yes" >> "$GITHUB_ENV"
              ;;
            active)
              ;;
            suspended)
              op_id=$(curl -sS --fail-with-body -X POST "$API/api/blogs/$SLUG/resume" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data '{}' | jq -r .op_id)
              wait_op "$op_id"
              ;;
            *)
              echo "blog $SLUG is in state '$state' and cannot be driven by this action"
              exit 1
              ;;
          esac

      - name: Open an admin session
        if: ${{ env.INSTALLED != 'yes' || hashFiles('content/index.json') != '' }}
        env:
          EMAIL: ${{ secrets.PLYM_CLOUD_EMAIL }}
          PASSWORD: ${{ secrets.PLYM_CLOUD_PASSWORD }}
        run: |
          TOKEN=$(curl -sS --fail-with-body -X POST "$API/api/auth/login" -H 'Content-Type: application/json' --data "$(jq -n --arg e "$EMAIL" --arg p "$PASSWORD" '{email:$e,password:$p}')" | jq -r .access)
          echo "::add-mask::$TOKEN"
          handoff_url=""
          for _ in $(seq 1 6); do
            handoff_url=$(curl -sS -X POST "$API/api/blogs/$SLUG/admin-session" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data '{}' | jq -r '.url // empty')
            if [ -n "$handoff_url" ]; then
              break
            fi
            sleep 10
          done
          if [ -z "$handoff_url" ]; then
            echo "could not open an admin session on $SLUG"
            exit 1
          fi
          BASE="${handoff_url%%/plym-admin/handoff*}"
          CODE="${handoff_url#*code=}"
          TTOKEN=$(curl -sS --fail-with-body -X POST "$BASE/cloud/handoff" -H 'Content-Type: application/json' --data "$(jq -n --arg c "$CODE" '{code:$c}')" | jq -r .access_token)
          echo "::add-mask::$TTOKEN"
          echo "BASE=$BASE" >> "$GITHUB_ENV"
          echo "TTOKEN=$TTOKEN" >> "$GITHUB_ENV"

      - name: Refresh the template
        if: env.INSTALLED != 'yes'
        run: |
          OPS_BASE="$BASE/cloud/ops"
          OPS_TOKEN="$TTOKEN"
          wait_op() {
            local after=0 page state
            for _ in $(seq 1 200); do
              page=$(curl -sS --fail-with-body -H "Authorization: Bearer $OPS_TOKEN" "$OPS_BASE/$1/events?after=$after")
              echo "$page" | jq -r '.events[] | [.event, (.title // .message // .line // .outcome // "")] | join("  ")'
              after=$(echo "$page" | jq -r .next_after)
              state=$(echo "$page" | jq -r .state)
              case "$state" in
                succeeded|finished) return 0 ;;
                failed) echo "$page" | jq -c .error; return 1 ;;
              esac
              sleep 3
            done
            echo "op $1 did not finish in time"
            return 1
          }
          op_id=$(curl -sS --fail-with-body -X POST "$BASE/cloud/templates" -H "Authorization: Bearer $TTOKEN" -H 'Content-Type: application/json' --data "$(jq -n --arg n "$TEMPLATE" '{name:$n,source:"public"}')" | jq -r .op_id)
          wait_op "$op_id"

      - name: Publish content
        if: ${{ hashFiles('content/index.json') != '' }}
        run: |
          existing=$(curl -sS --fail-with-body -H "Authorization: Bearer $TTOKEN" "$BASE/api/posts?include_drafts=true&page_size=200" | jq -c '[.items[] | {slug, id, status}]')
          jq -c 'to_entries[]' content/index.json | while read -r item; do
            entry=$(echo "$item" | jq -c .value)
            dir="content/$(echo "$item" | jq -r '.key + 1')"
            post_slug=$(echo "$entry" | jq -r .slug)
            match=$(echo "$existing" | jq -c --arg s "$post_slug" '.[] | select(.slug == $s)')
            if [ -n "$match" ]; then
              if [ "$(echo "$match" | jq -r .status)" = "published" ]; then
                echo "$post_slug already published, skipping"
              else
                post_id=$(echo "$match" | jq -r .id)
                curl -sS --fail-with-body -o /dev/null -X PATCH "$BASE/api/posts/$post_id" -H "Authorization: Bearer $TTOKEN" -H 'Content-Type: application/json' --data '{"status":"published"}'
                echo "$post_slug existed as a draft; published it as post $post_id"
              fi
              continue
            fi
            if [ ! -f "$dir/content.md" ]; then
              echo "$dir/content.md not found for $post_slug"
              exit 1
            fi
            body=$(cat "$dir/content.md")
            if [ -d "$dir/media" ]; then
              for f in "$dir/media"/*; do
                [ -f "$f" ] || continue
                fname=$(basename "$f")
                url=$(curl -sS --fail-with-body -X POST "$BASE/api/media" -H "Authorization: Bearer $TTOKEN" -F "file=@$f" | jq -r .url)
                body=${body//"./media/$fname"/"$url"}
                body=${body//"media/$fname"/"$url"}
              done
            fi
            cover_url=""
            cover_path=$(echo "$entry" | jq -r '.cover // empty')
            if [ -n "$cover_path" ]; then
              cover_url=$(curl -sS --fail-with-body -X POST "$BASE/api/media" -H "Authorization: Bearer $TTOKEN" -F "file=@content/$cover_path" | jq -r .url)
            fi
            faq_ids='[]'
            while read -r faq; do
              [ -n "$faq" ] || continue
              fid=$(curl -sS --fail-with-body -X POST "$BASE/api/faqs" -H "Authorization: Bearer $TTOKEN" -H 'Content-Type: application/json' --data-binary "$faq" | jq -r .id)
              faq_ids=$(echo "$faq_ids" | jq -c --argjson id "$fid" '. + [$id]')
            done < <(echo "$entry" | jq -c '.faqs // [] | .[] | {question, answer}')
            payload=$(echo "$entry" | jq -c --arg c "$body" --arg cv "$cover_url" --argjson f "$faq_ids" '{title, slug, content: $c, tags: (.tags // []), faqs: $f} + (if .excerpt then {excerpt} else {} end) + (if $cv != "" then {cover: $cv} else {} end)')
            post_id=$(curl -sS --fail-with-body -X POST "$BASE/api/posts" -H "Authorization: Bearer $TTOKEN" -H 'Content-Type: application/json' --data-binary "$payload" | jq -r .id)
            curl -sS --fail-with-body -o /dev/null -X PATCH "$BASE/api/posts/$post_id" -H "Authorization: Bearer $TTOKEN" -H 'Content-Type: application/json' --data '{"status":"published"}'
            echo "published $post_slug as post $post_id"
          done

      - name: Verify the demo address and suspend
        env:
          EMAIL: ${{ secrets.PLYM_CLOUD_EMAIL }}
          PASSWORD: ${{ secrets.PLYM_CLOUD_PASSWORD }}
        run: |
          served=no
          for _ in 1 2 3 4 5; do
            if curl -sSf -o /dev/null "https://$DEMO_HOST/"; then
              served=yes
              break
            fi
            sleep 5
          done
          if [ "$served" != "yes" ]; then
            echo "https://$DEMO_HOST/ is not serving; the blog stays running at https://$SLUG.plym.space"
            exit 1
          fi
          if [ -f content/index.json ]; then
            for post_slug in $(jq -r '.[].slug' content/index.json); do
              served=no
              for _ in 1 2 3 4 5 6 7 8; do
                if curl -sSf -o /dev/null "https://$DEMO_HOST/$post_slug"; then
                  served=yes
                  break
                fi
                sleep 5
              done
              if [ "$served" != "yes" ]; then
                echo "https://$DEMO_HOST/$post_slug is not serving; not suspending, the blog stays running"
                exit 1
              fi
              echo "https://$DEMO_HOST/$post_slug serves"
            done
          fi
          TOKEN=$(curl -sS --fail-with-body -X POST "$API/api/auth/login" -H 'Content-Type: application/json' --data "$(jq -n --arg e "$EMAIL" --arg p "$PASSWORD" '{email:$e,password:$p}')" | jq -r .access)
          echo "::add-mask::$TOKEN"
          OPS_BASE="$API/api/ops"
          OPS_TOKEN="$TOKEN"
          wait_op() {
            local after=0 page state
            for _ in $(seq 1 200); do
              page=$(curl -sS --fail-with-body -H "Authorization: Bearer $OPS_TOKEN" "$OPS_BASE/$1/events?after=$after")
              echo "$page" | jq -r '.events[] | [.event, (.title // .message // .line // .outcome // "")] | join("  ")'
              after=$(echo "$page" | jq -r .next_after)
              state=$(echo "$page" | jq -r .state)
              case "$state" in
                succeeded|finished) return 0 ;;
                failed) echo "$page" | jq -c .error; return 1 ;;
              esac
              sleep 3
            done
            echo "op $1 did not finish in time"
            return 1
          }
          op_id=$(curl -sS --fail-with-body -X POST "$API/api/blogs/$SLUG/suspend" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data '{}' | jq -r .op_id)
          wait_op "$op_id"
          echo "suspended $SLUG; https://$DEMO_HOST/ keeps serving from R2"
