fonts:
  # Inter stands in for Pretendard, whose Latin is Inter-derived and which the
  # source site declares for all of its chrome. Inter is variable, so every
  # role below arrives in the one file a single weight would have cost.
  heading:
    family: Inter
    weights:
      light: 300
      regular: 400
      bold: 600
      black: 700
  # Lato carries the article body. The family has no 500 or 600 face, so only
  # the two it really ships are requested.
  body:
    family: Lato
    weights:
      regular: 400
      bold: 700

colors:
  primary: "#121A42"
  secondary: "#6A7092"
  accent: "#BF111F"
  background: "#FFFFFF"

prism:
  theme: tomorrow
