<script>
(function () {
  var links = document.querySelectorAll('.ep-rail-link');
  if (links.length && 'IntersectionObserver' in window) {
    var byId = {};
    var targets = [];
    Array.prototype.forEach.call(links, function (link) {
      var id = decodeURIComponent(link.getAttribute('href').slice(1));
      var heading = document.getElementById(id);
      if (heading) { byId[id] = link; targets.push(heading); }
    });
    var seen = {};
    var mark = function () {
      var current = null;
      for (var i = 0; i < targets.length; i++) { if (seen[targets[i].id]) { current = targets[i].id; break; } }
      Array.prototype.forEach.call(links, function (link) { link.classList.remove('is-current'); });
      if (current && byId[current]) { byId[current].classList.add('is-current'); }
    };
    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) { seen[entry.target.id] = entry.isIntersecting; });
      mark();
    }, { rootMargin: '-72px 0px -70% 0px' });
    targets.forEach(function (heading) { observer.observe(heading); });
  }

  var boxes = document.querySelectorAll('.plym-content .task-list-item > input[type="checkbox"]');
  Array.prototype.forEach.call(boxes, function (box) {
    var label = (box.parentNode.textContent || '').trim();
    if (label) { box.setAttribute('aria-label', label); }
  });
})();
</script>
